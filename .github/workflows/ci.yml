name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenantkit
          POSTGRES_PASSWORD: tenantkit
          POSTGRES_DB: tenantkit
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tenantkit" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_OWNER_URL: postgresql://tenantkit:tenantkit@localhost:5433
      APP_DB_PASSWORD: tenantkit_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tenantkit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
